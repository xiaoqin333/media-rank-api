services:
  media-rank-api:
    build: .
    container_name: media-rank-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - rank-api.env
    environment:
      - TZ=Asia/Shanghai
      - HOST=127.0.0.1
      - PORT=8891
      - ROOT_PATH=/rank-api
      - CACHE_TTL_SECONDS=600
      - RATE_LIMIT_PER_MINUTE=120
      - CORS_ORIGINS=*
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8891/health', timeout=3).read(1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
