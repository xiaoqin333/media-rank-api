<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>影视榜单</title>
  <style>
    :root {
      --bg: #f6f6fa;
      --card: #ffffff;
      --text: #252438;
      --muted: #7c7a90;
      --border: #e7e5ee;
      --primary: #7c5cff;
      --primary-soft: #f1edff;
      --shadow: 0 12px 35px rgba(41, 34, 78, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    button, input, select { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid rgba(231, 229, 238, 0.9);
      backdrop-filter: blur(16px);
    }

    .topbar-inner {
      width: min(1580px, calc(100% - 36px));
      height: 70px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: max-content;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      color: white;
      font-size: 21px;
      background: linear-gradient(145deg, #8b6bff, #603de4);
      box-shadow: 0 9px 22px rgba(124, 92, 255, 0.3);
    }

    .source-tabs {
      display: flex;
      align-items: stretch;
      align-self: stretch;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .source-tabs::-webkit-scrollbar { display: none; }

    .source-tab {
      position: relative;
      min-width: max-content;
      padding: 0 15px;
      border: 0;
      background: transparent;
      color: #57546b;
      font-weight: 700;
      transition: color 160ms ease;
    }

    .source-tab:hover { color: var(--text); }

    .source-tab.active { color: var(--primary); }

    .source-tab.active::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 0;
      height: 3px;
      border-radius: 4px 4px 0 0;
      background: var(--primary);
    }

    .top-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .icon-link {
      height: 38px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: white;
      color: #625f73;
      font-size: 13px;
      font-weight: 700;
    }

    .page {
      width: min(1580px, calc(100% - 36px));
      margin: 28px auto 48px;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--primary);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 3vw, 42px);
      letter-spacing: -1.4px;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 13px;
      border-radius: 999px;
      background: white;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      min-width: max-content;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #32c27c;
      box-shadow: 0 0 0 4px rgba(50, 194, 124, 0.12);
    }

    .panel {
      padding: 20px 22px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .filter-row {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      min-height: 47px;
      border-bottom: 1px solid #f0eef5;
    }

    .filter-row:last-child { border-bottom: 0; }

    .filter-label {
      color: #8b889b;
      font-size: 14px;
      font-weight: 700;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .chip {
      min-height: 34px;
      padding: 0 15px;
      border: 1px solid transparent;
      border-radius: 7px;
      color: #4c495c;
      background: #f2f1f5;
      font-size: 13px;
      font-weight: 650;
      transition: 150ms ease;
    }

    .chip:hover { background: #eae7f2; }

    .chip.active {
      color: #6845ef;
      background: var(--primary-soft);
      border-color: #d8cdff;
    }

    .toolbar-row {
      display: grid;
      grid-template-columns: minmax(230px, 410px) minmax(230px, 1fr) minmax(180px, 260px);
      align-items: center;
      gap: 14px;
      padding-top: 17px;
    }

    .search {
      position: relative;
    }

    .search svg {
      position: absolute;
      left: 14px;
      top: 50%;
      width: 18px;
      height: 18px;
      transform: translateY(-50%);
      color: #9b98aa;
    }

    .search input,
    .select {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fbfbfd;
      color: var(--text);
      outline: none;
    }

    .search input {
      padding: 0 14px 0 42px;
    }

    .select { padding: 0 12px; }

    .search input:focus,
    .select:focus {
      border-color: #b7a7ff;
      box-shadow: 0 0 0 3px rgba(124, 92, 255, 0.1);
    }

    .rating-control {
      height: 42px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 11px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fbfbfd;
      color: var(--muted);
      font-size: 13px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }

    .meta-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 25px 2px 15px;
      color: var(--muted);
      font-size: 13px;
    }

    .meta-line strong {
      color: var(--text);
      font-size: 15px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 21px 18px;
    }

    .media-card {
      position: relative;
      min-width: 0;
      cursor: pointer;
    }

    .poster-wrap {
      position: relative;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      border-radius: 14px;
      background:
        linear-gradient(145deg, rgba(124, 92, 255, 0.14), rgba(39, 34, 64, 0.08)),
        #dedbe7;
      box-shadow: 0 10px 24px rgba(36, 31, 56, 0.12);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .media-card:hover .poster-wrap {
      transform: translateY(-4px);
      box-shadow: 0 17px 35px rgba(36, 31, 56, 0.2);
    }

    .poster {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .poster-fallback {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      color: #5b477d;
      text-align: center;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.5;
      background:
        radial-gradient(circle at 25% 15%, rgba(124, 92, 255, 0.28), transparent 38%),
        linear-gradient(145deg, #e8e1ff, #d9d5e8);
    }

    .poster-wrap.failed .poster { display: none; }
    .poster-wrap.failed .poster-fallback { display: grid; }

    .badge {
      position: absolute;
      z-index: 2;
      min-width: 50px;
      padding: 6px 10px;
      border-radius: 9px;
      color: white;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      box-shadow: 0 4px 15px rgba(22, 20, 33, 0.16);
    }

    .badge-type {
      top: 12px;
      left: 12px;
      background: #7d5cff;
    }

    .badge-rank {
      top: 12px;
      right: 12px;
      background: #ef8067;
    }

    .source-tag {
      position: absolute;
      top: 48px;
      left: 12px;
      z-index: 2;
      padding: 4px 8px;
      border-radius: 7px;
      color: white;
      background: rgba(24, 20, 35, 0.62);
      backdrop-filter: blur(7px);
      font-size: 11px;
      font-weight: 700;
    }

    .card-overlay {
      position: absolute;
      inset: auto 0 0;
      padding: 48px 14px 14px;
      color: white;
      background: linear-gradient(transparent, rgba(10, 8, 17, 0.9));
      opacity: 0;
      transition: opacity 180ms ease;
      font-size: 12px;
      line-height: 1.65;
    }

    .media-card:hover .card-overlay {
      opacity: 1;
    }

    .card-overlay p {
      margin: 0;
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
    }

    .card-copy {
      padding: 11px 2px 0;
    }

    .card-title {
      margin: 0;
      overflow: hidden;
      color: #292637;
      font-size: 15px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-subtitle {
      margin: 6px 0 0;
      overflow: hidden;
      color: #888598;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .skeleton {
      border-radius: 14px;
      overflow: hidden;
      background: #eceaf1;
      aspect-ratio: 2 / 3;
      animation: pulse 1.2s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.55; }
      to { opacity: 1; }
    }

    .empty {
      display: none;
      padding: 70px 20px;
      color: var(--muted);
      text-align: center;
    }

    .empty-icon {
      margin-bottom: 12px;
      font-size: 42px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      gap: 9px;
      margin-top: 32px;
    }

    .page-btn {
      min-width: 42px;
      height: 40px;
      padding: 0 15px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: white;
      color: #57546b;
      font-weight: 700;
    }

    .page-btn.current {
      color: white;
      border-color: var(--primary);
      background: var(--primary);
    }

    .page-btn:disabled {
      cursor: not-allowed;
      opacity: 0.42;
    }

    .footer {
      margin-top: 27px;
      color: #9b98a8;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 1200px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .toolbar-row { grid-template-columns: 1fr 1fr; }
      .rating-control { grid-column: 1 / -1; }
    }

    @media (max-width: 900px) {
      .topbar-inner { height: auto; min-height: 64px; flex-wrap: wrap; gap: 4px 18px; padding: 10px 0; }
      .source-tabs { order: 3; width: 100%; min-height: 42px; }
      .source-tab { padding: 0 10px; }
      .top-actions .icon-label { display: none; }
      .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .hero { align-items: flex-start; flex-direction: column; }
    }

    @media (max-width: 640px) {
      .topbar-inner, .page { width: min(100% - 24px, 1580px); }
      .page { margin-top: 20px; }
      .panel { padding: 15px; border-radius: 16px; }
      .filter-row { grid-template-columns: 1fr; gap: 8px; padding: 11px 0; }
      .filter-label { font-size: 13px; }
      .chip-list { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 3px; }
      .chip { min-width: max-content; padding: 0 12px; }
      .toolbar-row { grid-template-columns: 1fr; }
      .rating-control { grid-column: auto; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
      .card-title { font-size: 14px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="./">
        <span class="brand-mark">▶</span>
        <span>影视榜单</span>
      </a>
      <nav class="source-tabs" id="sourceTabs" aria-label="榜单平台"></nav>
      <div class="top-actions">
        <a class="icon-link" href="./docs" target="_blank" rel="noopener" title="API 文档">
          <span>⌘</span><span class="icon-label">API 文档</span>
        </a>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="hero">
      <div>
        <p class="eyebrow">DISCOVER · 每日热度追踪</p>
        <h1>发现正在流行的影视</h1>
        <p class="subtitle">聚合 TMDB、豆瓣、爱奇艺、腾讯视频、优酷、芒果TV实时榜单</p>
      </div>
      <div class="status-pill"><span class="status-dot"></span><span id="statusText">数据连接正常</span></div>
    </section>

    <section class="panel" aria-label="榜单筛选">
      <div class="filter-row">
        <div class="filter-label">类型</div>
        <div class="chip-list" id="typeFilters">
          <button class="chip active" data-type="movie">电影</button>
          <button class="chip" data-type="tv">电视剧</button>
          <button class="chip" data-type="variety">综艺</button>
          <button class="chip" data-type="anime">动漫</button>
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-label">排序</div>
        <div class="chip-list">
          <select class="select" id="sortSelect" aria-label="排序">
            <option value="rank">榜单顺序</option>
            <option value="score">评分降序</option>
            <option value="year">年份降序</option>
            <option value="title">标题排序</option>
          </select>
        </div>
      </div>
      <div class="toolbar-row">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-3.5-3.5"></path>
          </svg>
          <input id="searchInput" type="search" placeholder="搜索当前榜单中的影视名称" autocomplete="off">
        </label>
        <label class="rating-control">
          <span>最低评分</span>
          <input id="scoreRange" type="range" min="0" max="10" step="0.5" value="0">
          <strong id="scoreValue">不限</strong>
        </label>
        <select class="select" id="pageSize" aria-label="每页数量">
          <option value="20">每页 20 部</option>
          <option value="30">每页 30 部</option>
          <option value="50">每页 50 部</option>
        </select>
      </div>
    </section>

    <div class="meta-line">
      <div><strong id="resultTitle">TMDB · 电影</strong>　<span id="resultCount">正在加载</span></div>
      <div id="updatedText">缓存 10 分钟</div>
    </div>

    <section class="grid" id="mediaGrid" aria-live="polite"></section>
    <section class="empty" id="emptyState">
      <div class="empty-icon">⌕</div>
      <div>没有找到符合条件的影视</div>
    </section>

    <nav class="pagination" id="pagination" aria-label="分页"></nav>
    <footer class="footer">数据来源于各平台公开榜单，仅供个人观影参考。</footer>
  </main>

  <script>
    const API_BASE = new URL("api/v1", window.location.href).toString().replace(/\/$/, "");
    const TYPE_NAMES = { movie: "电影", tv: "电视剧", variety: "综艺", anime: "动漫" };
    const SOURCE_COLORS = {
      tmdb: "#01b4e4",
      douban: "#3ca55c",
      iqiyi: "#36a852",
      tencent: "#3e8cff",
      youku: "#ef4f79",
      mango: "#ff7a2f",
    };
    const SOURCES = [
      { id: "tmdb", name: "TMDB" },
      { id: "douban", name: "豆瓣" },
      { id: "iqiyi", name: "爱奇艺" },
      { id: "tencent", name: "腾讯视频" },
      { id: "youku", name: "优酷" },
      { id: "mango", name: "芒果TV" },
    ];

    const state = {
      source: "tmdb",
      type: "movie",
      page: 1,
      limit: 20,
      order: "rank",
      query: "",
      minScore: 0,
      items: [],
      loading: false,
      cacheHit: false,
      fetchedAt: null,
    };

    const initialParams = new URLSearchParams(window.location.search);
    const initialSource = initialParams.get("source");
    const initialType = initialParams.get("type");
    if (SOURCES.some((source) => source.id === initialSource)) {
      state.source = initialSource;
    }
    if (Object.prototype.hasOwnProperty.call(TYPE_NAMES, initialType)) {
      state.type = initialType;
    }

    const elements = {
      sourceTabs: document.getElementById("sourceTabs"),
      typeFilters: document.getElementById("typeFilters"),
      sortSelect: document.getElementById("sortSelect"),
      searchInput: document.getElementById("searchInput"),
      scoreRange: document.getElementById("scoreRange"),
      scoreValue: document.getElementById("scoreValue"),
      pageSize: document.getElementById("pageSize"),
      grid: document.getElementById("mediaGrid"),
      empty: document.getElementById("emptyState"),
      pagination: document.getElementById("pagination"),
      resultTitle: document.getElementById("resultTitle"),
      resultCount: document.getElementById("resultCount"),
      updatedText: document.getElementById("updatedText"),
      statusText: document.getElementById("statusText"),
    };

    function sourceName() {
      return SOURCES.find((item) => item.id === state.source)?.name || state.source;
    }

    function renderSourceTabs() {
      elements.sourceTabs.innerHTML = SOURCES.map((source) => `
        <button class="source-tab ${source.id === state.source ? "active" : ""}" data-source="${source.id}">
          ${source.name}
        </button>
      `).join("");
    }

    function renderSkeletons() {
      elements.grid.innerHTML = Array.from({ length: Math.min(state.limit, 15) }, () => '<div class="skeleton"></div>').join("");
      elements.empty.style.display = "none";
      elements.pagination.innerHTML = "";
    }

    function filteredItems() {
      const query = state.query.trim().toLowerCase();
      let items = state.items.filter((item) => {
        if (query && !String(item.title || "").toLowerCase().includes(query)) return false;
        if (state.minScore > 0 && Number(item.score || 0) < state.minScore) return false;
        return true;
      });
      if (state.order === "score") {
        items.sort((a, b) => Number(b.score || 0) - Number(a.score || 0));
      } else if (state.order === "year") {
        items.sort((a, b) => Number(b.year || 0) - Number(a.year || 0));
      } else if (state.order === "title") {
        items.sort((a, b) => String(a.title).localeCompare(String(b.title), "zh-CN"));
      } else {
        items.sort((a, b) => Number(a.rank || 0) - Number(b.rank || 0));
      }
      return items;
    }

    function posterUrl(url) {
      return `${API_BASE}/image?url=${encodeURIComponent(url)}`;
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function renderCards() {
      const items = filteredItems();
      elements.empty.style.display = items.length ? "none" : "block";
      elements.grid.innerHTML = items.map((item) => {
        const title = escapeHtml(item.title);
        const badge = item.score != null ? Number(item.score).toFixed(1) : `#${item.rank}`;
        const poster = item.poster ? posterUrl(item.poster) : "";
        const meta = [item.year || "", item.description || ""].filter(Boolean).join(" · ");
        return `
          <article class="media-card" data-href="${escapeHtml(item.url || "#")}">
            <div class="poster-wrap">
              ${poster ? `<img class="poster" loading="lazy" src="${escapeHtml(poster)}" alt="${title}" onerror="this.parentElement.classList.add('failed')">` : ""}
              <div class="poster-fallback">${title}</div>
              <span class="badge badge-type">${TYPE_NAMES[item.media_type] || item.media_type}</span>
              <span class="badge badge-rank">${escapeHtml(badge)}</span>
              <span class="source-tag" style="background:${SOURCE_COLORS[item.source] || "#6d5b9a"}">${escapeHtml(item.source_name)}</span>
              ${item.description ? `<div class="card-overlay"><p>${escapeHtml(item.description)}</p></div>` : ""}
            </div>
            <div class="card-copy">
              <h2 class="card-title" title="${title}">${title}</h2>
              <p class="card-subtitle">${escapeHtml(meta || "暂无简介")}</p>
            </div>
          </article>
        `;
      }).join("");

      document.querySelectorAll(".media-card").forEach((card) => {
        card.addEventListener("click", () => {
          const href = card.dataset.href;
          if (href && href !== "#") window.open(href, "_blank", "noopener");
        });
      });

      elements.resultCount.textContent = `共 ${items.length} 部`;
      elements.resultTitle.textContent = `${sourceName()} · ${TYPE_NAMES[state.type]}`;
      if (state.fetchedAt) {
        const fetched = new Date(state.fetchedAt);
        elements.updatedText.textContent = `${state.cacheHit ? "缓存数据" : "刚刚更新"} · ${fetched.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })}`;
      }
      renderPagination(items.length);
    }

    function renderPagination(count) {
      if (!count && state.page === 1) {
        elements.pagination.innerHTML = "";
        return;
      }
      elements.pagination.innerHTML = `
        <button class="page-btn" id="prevPage" ${state.page <= 1 ? "disabled" : ""}>上一页</button>
        <button class="page-btn current">${state.page}</button>
        <button class="page-btn" id="nextPage" ${count < state.limit ? "disabled" : ""}>下一页</button>
      `;
      document.getElementById("prevPage")?.addEventListener("click", () => {
        if (state.page > 1) {
          state.page -= 1;
          loadRanking();
          window.scrollTo({ top: 360, behavior: "smooth" });
        }
      });
      document.getElementById("nextPage")?.addEventListener("click", () => {
        if (count >= state.limit) {
          state.page += 1;
          loadRanking();
          window.scrollTo({ top: 360, behavior: "smooth" });
        }
      });
    }

    async function loadRanking() {
      if (state.loading) return;
      state.loading = true;
      renderSkeletons();
      elements.statusText.textContent = "正在获取榜单";
      try {
        const params = new URLSearchParams({
          type: state.type,
          page: String(state.page),
          limit: String(state.limit),
        });
        const response = await fetch(`${API_BASE}/rankings/${encodeURIComponent(state.source)}?${params}`);
        const data = await response.json();
        if (!response.ok || !data.success) {
          throw new Error(data?.error?.message || `请求失败：${response.status}`);
        }
        state.items = data.items || [];
        state.cacheHit = Boolean(data.cache?.hit);
        state.fetchedAt = data.fetched_at;
        elements.statusText.textContent = "数据连接正常";
        renderCards();
      } catch (error) {
        state.items = [];
        elements.statusText.textContent = "数据获取失败";
        elements.grid.innerHTML = "";
        elements.empty.style.display = "block";
        elements.empty.innerHTML = `<div class="empty-icon">!</div><div>${escapeHtml(error.message)}</div>`;
        elements.resultCount.textContent = "加载失败";
        elements.pagination.innerHTML = "";
      } finally {
        state.loading = false;
      }
    }

    elements.sourceTabs.addEventListener("click", (event) => {
      const button = event.target.closest("[data-source]");
      if (!button || button.dataset.source === state.source) return;
      state.source = button.dataset.source;
      state.page = 1;
      renderSourceTabs();
      loadRanking();
    });

    elements.typeFilters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-type]");
      if (!button || button.dataset.type === state.type) return;
      elements.typeFilters.querySelectorAll(".chip").forEach((chip) => chip.classList.toggle("active", chip === button));
      state.type = button.dataset.type;
      state.page = 1;
      loadRanking();
    });

    elements.sortSelect.addEventListener("change", () => {
      state.order = elements.sortSelect.value;
      renderCards();
    });

    elements.searchInput.addEventListener("input", () => {
      state.query = elements.searchInput.value;
      renderCards();
    });

    elements.scoreRange.addEventListener("input", () => {
      state.minScore = Number(elements.scoreRange.value);
      elements.scoreValue.textContent = state.minScore > 0 ? `${state.minScore.toFixed(1)} 分` : "不限";
      renderCards();
    });

    elements.pageSize.addEventListener("change", () => {
      state.limit = Number(elements.pageSize.value);
      state.page = 1;
      loadRanking();
    });

    elements.typeFilters.querySelectorAll(".chip").forEach((chip) => {
      chip.classList.toggle("active", chip.dataset.type === state.type);
    });
    renderSourceTabs();
    loadRanking();
  </script>
</body>
</html>
